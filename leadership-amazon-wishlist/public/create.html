<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Order Request</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">Club Orders</a>
    <a href="/">All Requests</a>
    <a href="/create.html" class="active">New Request</a>
    <a href="/admin.html">Admin</a>
  </nav>

  <div class="container">
    <h1>Create Order Request</h1>

    <form id="request-form" class="card">
      <div class="form-row">
        <div class="form-group">
          <label for="club-name">Club Name *</label>
          <select id="club-select">
            <option value="">-- Select a club --</option>
          </select>
          <div class="hint">Or add a new club below</div>
        </div>
        <div class="form-group">
          <label for="new-club">New Club Name</label>
          <input type="text" id="new-club" placeholder="Enter new club name">
          <div class="hint">Leave blank if selecting an existing club</div>
        </div>
      </div>

      <div class="form-group">
        <label for="person-name">Your Name *</label>
        <input type="text" id="person-name" required placeholder="Teacher or student name">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="urgency">Urgency *</label>
          <select id="urgency" required>
            <option value="">-- Select --</option>
            <option value="not-urgent">Not Urgent</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="form-group" id="delivery-date-group" style="display:none;">
          <label for="desired-delivery">Desired Delivery Date *</label>
          <input type="date" id="desired-delivery">
          <div class="hint">Required for urgent requests</div>
        </div>
      </div>

      <div class="form-group">
        <label for="message">Message / Details *</label>
        <textarea id="message" required placeholder="Why is this being requested? Any physical handling instructions? How should the order be given to the club?"></textarea>
      </div>

      <div class="form-group">
        <label>Items *</label>
        <div class="hint" style="margin-bottom:8px;">Add one or more Amazon items to this request.</div>
        <div id="items-container">
          <div class="item-row">
            <div>
              <input type="url" class="item-url" placeholder="Amazon item URL" required>
            </div>
            <div>
              <input type="number" class="item-qty" value="1" min="1" placeholder="Qty">
            </div>
            <div>
              <button type="button" class="btn btn-danger btn-sm remove-item" disabled>Remove</button>
            </div>
          </div>
        </div>
        <button type="button" id="add-item" class="btn btn-outline btn-sm" style="margin-top:8px;">+ Add Another Item</button>
      </div>

      <button type="submit" class="btn btn-primary">Submit Request</button>
    </form>
  </div>

  <script src="/js/create.js"></script>
</body>
</html>
