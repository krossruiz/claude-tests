<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Order Requests</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">Club Orders</a>
    <a href="/" class="active">All Requests</a>
    <a href="/create.html">New Request</a>
    <a href="/admin.html">Admin</a>
  </nav>

  <div class="container">
    <h1>Order Requests</h1>

    <div class="controls">
      <div>
        <label for="club-filter">Filter by Club</label>
        <select id="club-filter">
          <option value="">All Clubs</option>
        </select>
      </div>
      <div>
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="created">Date Requested (newest first)</option>
          <option value="delivery">Expected Delivery Date</option>
        </select>
      </div>
    </div>

    <div id="requests-list">
      <div class="loading-container"><div class="spinner"></div></div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
